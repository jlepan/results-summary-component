<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results Summary Component</title>
    <link rel="shortcut icon" type="image/png" href="img/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="card-results">
        <header>
            <h1>Your Result</h1>
            <div class="result-circle">
                <strong class="average-result"></strong>
                <p>of 100</p>
            </div>
            <span class="strong-text">Great</span>
            <p>
                You scored higher than 65&percnt; of the people who have taken these tests.
            </p>
        </header>
        <main>
            <article>
                <h2>Summary</h2>
                <section class="section-reaction">
                    <div class="flex-in-section">
                        <img src="img/icon-reaction.svg" alt="flash icon">
                        <h3>Reaction</h3>
                    </div>
                    <p>
                        <strong class="result"></strong> &sol; 100
                    </p>
                </section>
                <section class="section-memory">
                    <div class="flex-in-section">
                        <img src="img/icon-memory.svg" alt="brain icon">
                        <h3>Memory</h3>
                    </div>
                    <p>
                        <strong class="result"></strong> &sol; 100
                    </p>
                </section>
                <section class="section-verbal">
                    <div class="flex-in-section">
                        <img src="img/icon-verbal.svg" alt="comment icon">
                        <h3>Verbal</h3>
                    </div>
                    <p>
                        <strong class="result"></strong> &sol; 100
                    </p>
                </section>
                <section class="section-visual">
                    <div class="flex-in-section">
                        <img src="img/icon-visual.svg" alt="eye icon">
                        <h3>Visual</h3>
                    </div>
                    <p>
                        <strong class="result"></strong> &sol; 100
                    </p>
                </section>
                <button type="button">Continue</button>
            </article>
        </main>
    </div>
    <footer>
        <p>Website by <a href="https://github.com/jlepan" target="_blank" rel="noopener noreferrer">Juliette Lepan</a></p>
        <p>Design by <a href="https://www.frontendmentor.io" target="_blank" rel="noopener noreferrer">Frontend Mentor</a></p>
    </footer>
</body>
</html>
